<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>孤選 (Kosen)</title>
    <style>
        :root { --theme-pink: #FD3A73; --bg-dark: #121212; --card-dark: #242424; --text-light: #FFFFFF; --text-muted: #B3B3B3; }
        html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-light); overflow: hidden; width: 100%; height: 100%; }
        * { box-sizing: border-box; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        .app-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        #card-stack { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .profile-card { position: absolute; width: 90vw; max-width: 380px; height: 75vh; max-height: 600px; background: var(--card-dark); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .profile-pic { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .profile-info { position: relative; z-index: 2; padding: 25px; background: linear-gradient(to top, rgba(0,0,0,0.95) 30%, transparent); }
        .profile-header { display: flex; justify-content: space-between; align-items: center; }
        .profile-info h3 { font-size: 28px; margin: 0; }
        .profile-info h3 small { font-size: 0.5em; color: var(--text-muted); margin-left: 8px; } /* 学籍番号用のスタイル */
        .profile-info p { font-size: 18px; margin: 5px 0 10px; color: var(--text-muted); }
        .profile-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .profile-tag { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px; padding: 5px 12px; font-size: 14px; }
        .actions { display: flex; justify-content: space-evenly; align-items: center; padding: 15px 0; }
        .action-btn { background: var(--card-dark); border: 1px solid #444; border-radius: 50%; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.1); }
        .action-btn svg { width: 35px; height: 35px; }
        .nope svg { stroke: #FD5068; }
        .like svg { stroke: #2DB97B; }
        #no-more-cards { text-align: center; color: var(--text-muted); }
        .report-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; }
        nav { width: 100%; background: var(--card-dark); display: flex; justify-content: space-around; padding: 5px 0; border-top: 1px solid #333; }
        nav button { background: none; border: none; cursor: pointer; color: #777; padding: 10px; }
        nav button.active { color: var(--theme-pink); }
        nav svg { width: 28px; height: 28px; }
        .login-container { flex-grow: 1; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .login-container h1 { font-size: 48px; font-weight: bold; letter-spacing: 2px; }
        .login-container p { color: var(--text-muted); }
        .login-container input, .login-container select { width: 100%; max-width: 300px; border-radius: 25px; text-align: center; background-color: var(--card-dark); color: var(--text-light); border: 1px solid #444; padding: 12px; margin-bottom: 10px;}
        .login-container button { width: 100%; max-width: 300px; border-radius: 25px; background: linear-gradient(90deg, #FD297B, #FF655B); border: none; padding: 12px; color: white; font-weight: bold; }
        .list-container { flex-grow: 1; overflow-y: auto; padding: 20px 20px 80px; }
        .list-container h2 { color: var(--theme-pink); }
        .match-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
        .match-avatar { width: 60px; height: 60px; border-radius: 50%; background-color: #333; margin-right: 15px; object-fit: cover; }
        .profile-edit-section { margin-bottom: 2em; }
        .profile-edit-section button { background: var(--theme-pink); border: none; padding: 12px; font-weight: bold; border-radius: 25px; }
        .profile-edit-section .delete-button { background: #dc3545; }
        .profile-edit-section .logout-button { background: #6c757d; }
        #avatar-selection-grid, #avatar-edit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 300px; margin: 1em auto; }
        .avatar-option { width: 100%; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color 0.2s; }
        .avatar-option.selected { border-color: var(--theme-pink); }
        .chat-header { display: flex; align-items: center; padding: 10px; background-color: var(--card-dark); border-bottom: 1px solid #333; }
        .chat-back-btn { background: none; border: none; color: var(--text-light); margin-right: 10px; cursor: pointer; }
        .chat-header h2 { font-size: 1.2em; margin: 0; }
        .messages-container { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        .message-bubble { max-width: 70%; padding: 10px 15px; border-radius: 20px; margin-bottom: 10px; line-height: 1.4; }
        .message-bubble.sent { background-color: var(--theme-pink); align-self: flex-end; }
        .message-bubble.received { background-color: #3e3e3e; align-self: flex-start; }
        .chat-input-area { display: flex; padding: 10px; background-color: var(--card-dark); border-top: 1px solid #333; }
        #chat-input { flex-grow: 1; background-color: #3e3e3e; border: none; color: var(--text-light); border-radius: 20px; padding: 10px 15px; }
        #chat-send-btn { background: none; border: none; color: var(--theme-pink); padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="login-screen" class="screen active"><div class="login-container"><h1>孤選</h1><p>学校のメールアドレスでログイン/登録</p><input type="email" id="email-input" placeholder="sXXXXX@s.akashi.ac.jp"><button onclick="sendSignInLink()">認証メールを送信</button></div></div>
    <div id="profile-setup-screen" class="screen"><div class="login-container"><h1>ようこそ！</h1><p>はじめにプロフィールを設定してください</p><p style="font-size: 0.9em; margin-top: 1.5em;">好きなアバターを選んでください</p><div id="avatar-selection-grid"></div><input type="text" id="register-name" placeholder="ニックネーム"><select id="register-faculty"><option value="機械工学科">M科</option><option value="電気情報工学科">E科</option><option value="都市システム工学科">C科</option><option value="建築学科">A科</option></select><select id="register-grade"><option value="1年">1年</option><option value="2年">2年</option><option value="3年">3年</option><option value="4年">4年</option><option value="5年">5年</option><option value="専攻科1年">専攻科1年</option><option value="専攻科2年">専攻科2年</option></select><button onclick="handleProfileSetup()" id="setup-button">登録して利用を開始する</button></div></div>
    <div id="main-screen" class="screen"><div class="app-container"><div id="card-stack"></div><div id="actions-area" class="actions"><div class="action-btn nope" onclick="handleNope()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></div><div class="action-btn like" onclick="handleLikeClick()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg></div></div></div><nav id="main-nav"></nav></div>
    <div id="matches-screen" class="screen"><div class="list-container"><h2>マッチング一覧</h2><div id="match-list"></div></div><nav id="matches-nav"></nav></div>
    <div id="profile-screen" class="screen"><div class="list-container"><div class="profile-edit-section"><h2>アバターの変更</h2><div id="avatar-edit-grid"></div><button onclick="updateAvatar()">アバターを更新</button></div><div class="profile-edit-section"><h2>興味・関心タグ</h2><div id="profile-interests-editor"></div><button onclick="updateInterests()">興味タグを更新</button></div><div class="profile-edit-section"><h2>アカウント設定</h2><button class="logout-button" onclick="handleLogout()">ログアウト</button><button class="delete-button" onclick="handleDeleteAccount()">アカウントを完全に削除する</button></div></div><nav id="profile-nav"></nav></div>
    
    <div id="chat-screen" class="screen">
        <div class="chat-header">
            <button class="chat-back-btn" onclick="showTab('matches-screen')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
            </button>
            <h2 id="chat-partner-name">相手の名前</h2>
        </div>
        <div class="messages-container" id="messages-container"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="メッセージを入力...">
            <button id="chat-send-btn" onclick="sendMessage()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
            </button>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyAcKf5BrhFFkv74WdaamqnrCY1qSRxsVjE", authDomain: "deaikei-kosen.firebaseapp.com", projectId: "deaikei-kosen", storageBucket: "deaikei-kosen.firebasestorage.app", messagingSenderId: "166298285211", appId: "1:166298285211:web:5381e5e419754e0376c23e" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
    <script>
        let loggedInUserId = null, allUsers = [], currentUserIndex = 0;
        let currentChatRoomId = null, unsubscribeChat = null;

        const allInterests = ["プログラミング", "機械学習", "電子工作", "設計", "実験", "ロボコン", "Python", "Java", "C++", "JavaScript", "CAD", "3Dプリンタ", "VR/AR", "ドローン", "Web制作", "アプリ開発", "デザイン", "映像制作", "DTM", "ゲーム制作", "eスポーツ", "バスケ", "サッカー", "テニス", "バドミントン", "野球", "陸上", "音楽", "軽音", "吹奏楽", "バンド", "ギター", "ピアノ", "写真", "筋トレ", "料理", "お菓子作り", "アニメ", "漫画", "ゲーム", "イラスト", "映画鑑賞", "読書", "旅行", "ツーリング", "資格勉強", "TOIC", "インターン", "起業したい", "ボランティア", "バイク"];
        const navHTML = `<button onclick="showTab('main-screen')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12.75 2.25A2.25 2.25 0 0010.5 4.5v15a2.25 2.25 0 002.25 2.25h.518a.75.75 0 00.74-1.023l-.26-1.037a1.5 1.5 0 011.025-1.742 1.5 1.5 0 011.742 1.025l.26 1.037a.75.75 0 00.74 1.023h.518a2.25 2.25 0 002.25-2.25v-15a2.25 2.25 0 00-2.25-2.25H12.75zM12 4.5h6.75v15H12V4.5zM3.75 6A2.25 2.25 0 001.5 8.25v9A2.25 2.25 0 003.75 19.5h.518a.75.75 0 00.74-1.023l-.26-1.037a1.5 1.5 0 011.025-1.742 1.5 1.5 0 011.742 1.025l.26 1.037A.75.75 0 008.482 19.5h.518A2.25 2.25 0 0011.25 17.25v-9A2.25 2.25 0 009 6H3.75zM3 8.25h6.75v9H3v-9z" /></svg></button><button onclick="showTab('matches-screen')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M4.848 2.771A49.144 49.144 0 0112 2.25c2.43 0 4.817.178 7.152.52 1.978.292 3.348 2.024 3.348 3.97v6.02c0 1.946-1.37 3.678-3.348 3.97a48.901 48.901 0 01-3.476.383.39.39 0 00-.297.17l-2.755 4.133a.75.75 0 01-1.248 0l-2.755-4.133a.39.39 0 00-.297-.17 48.9 48.9 0 01-3.476-.384c-1.978-.29-3.348-2.024-3.348-3.97V6.741c0-1.946 1.37-3.68 3.348-3.97zM6.75 8.25a.75.75 0 01.75-.75h9a.75.75 0 010 1.5h-9a.75.75 0 01-.75-.75zm.75 2.25a.75.75 0 000 1.5H12a.75.75 0 000-1.5H7.5z" clip-rule="evenodd" /></svg></button><button onclick="showTab('profile-screen')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" clip-rule="evenodd" /></svg></button>`;
        document.querySelectorAll('nav').forEach(nav => nav.innerHTML = navHTML);
        
        const avatarUrls = [
            '/Deaikei/images/account.png', '/Deaikei/images/astronaut.png', '/Deaikei/images/bakeneko.png', '/Deaikei/images/cat.png', '/Deaikei/images/dog (1).png', '/Deaikei/images/dog.png', '/Deaikei/images/fish.png', '/Deaikei/images/kappa.png', '/Deaikei/images/man.png', '/Deaikei/images/meerkat.png', '/Deaikei/images/oni.png', '/Deaikei/images/student.png', '/Deaikei/images/tanuki.png', '/Deaikei/images/teenager (1).png', '/Deaikei/images/teenager (2).png', '/Deaikei/images/teenager.png', '/Deaikei/images/turtle.png', '/Deaikei/images/user (1).png', '/Deaikei/images/user.png', '/Deaikei/images/woman.png'
        ];

        function showTab(screenId) {
            if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const screen = document.getElementById(screenId);
            if (screen) screen.classList.add('active');
            if (screenId === 'profile-setup-screen') renderAvatarSelectionGrid('avatar-selection-grid');
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            const navs = document.querySelectorAll('nav');
            if (screenId === 'main-screen') navs.forEach(nav => nav.children[0].classList.add('active'));
            if (screenId === 'matches-screen') navs.forEach(nav => nav.children[1].classList.add('active'));
            if (screenId === 'profile-screen') navs.forEach(nav => nav.children[2].classList.add('active'));
            if (screenId === 'matches-screen') renderMatches();
            if (screenId === 'profile-screen') renderProfileEditor();
        }

        async function handleProfileSetup() {
            const name = document.getElementById('register-name').value.trim();
            if (!name) { alert('ニックネームは必須です。'); return; }
            const selectedAvatar = document.querySelector('#avatar-selection-grid .avatar-option.selected');
            let avatarUrl = selectedAvatar ? selectedAvatar.dataset.url : '/Deaikei/images/user (1).png';
            const user = auth.currentUser;
            if (!user) return;
            const studentId = user.email.split('@')[0];
            await db.collection('users').doc(user.uid).set({
                uid: user.uid, studentId: studentId, name: name, photoURL: avatarUrl,
                faculty: document.getElementById('register-faculty').value,
                grade: document.getElementById('register-grade').value, 
                interests: []
            });
        }
        
        function renderCurrentCard() {
            const stack = document.getElementById('card-stack');
            const actions = document.getElementById('actions-area');
            if (currentUserIndex >= allUsers.length) {
                stack.innerHTML = `<div id="no-more-cards"><h3>表示できる相手がいません。</h3><p>時間をおいて再度お試しください。</p></div>`;
                actions.style.display = 'none';
                return;
            }
            actions.style.display = 'flex';
            const user = allUsers[currentUserIndex];
            const imageUrl = user.photoURL || '/Deaikei/images/user (1).png';
            stack.innerHTML = `<div class="profile-card" data-user-id="${user.uid}"><img src="${imageUrl}" class="profile-pic"><div class="profile-info"><div class="profile-header"><h3>${user.name} <small>(${user.studentId || ''})</small></h3><button class="report-btn" onclick="reportUser('${user.uid}', '${user.name}')">•••</button></div><p>${user.faculty}・${user.grade}</p><div class="profile-tags">${(user.interests || []).map(tag => `<div class="profile-tag">${tag}</div>`).join('')}</div></div></div>`;
        }

        async function renderMatches() {
            if (!loggedInUserId) return;
            const matchList = document.getElementById('match-list');
            matchList.innerHTML = "マッチング情報を読み込んでいます...";
            try {
                const myLikesSnapshot = await db.collection('likes').where('from', '==', loggedInUserId).get();
                const likedByMe = myLikesSnapshot.docs.map(doc => doc.data().to);
                if (likedByMe.length === 0) { matchList.innerHTML = "まだマッチングした相手がいません。"; return; }
                const matchedIds = [];
                const promises = [];
                for (let i = 0; i < likedByMe.length; i += 10) {
                    const chunk = likedByMe.slice(i, i + 10);
                    const q = db.collection('likes').where('to', '==', loggedInUserId).where('from', 'in', chunk);
                    promises.push(q.get());
                }
                const snapshots = await Promise.all(promises);
                snapshots.forEach(snapshot => { snapshot.forEach(doc => { matchedIds.push(doc.data().from); }); });
                if (matchedIds.length === 0) { matchList.innerHTML = "まだマッチングした相手がいません。"; return; }
                const userPromises = [];
                for (let i = 0; i < matchedIds.length; i += 10) {
                    const chunk = matchedIds.slice(i, i + 10);
                    const q = db.collection('users').where('uid', 'in', chunk);
                    userPromises.push(q.get());
                }
                const userSnapshots = await Promise.all(userPromises);
                matchList.innerHTML = "";
                userSnapshots.forEach(snapshot => {
                    snapshot.forEach(doc => {
                        const user = doc.data();
                        if (!user || !user.uid || !user.name) { console.warn("必要情報が欠けているユーザーデータが見つかりました。スキップします:", user); return; }
                        const imageUrl = user.photoURL || '/Deaikei/images/user (1).png';
                        matchList.innerHTML += `<div class="match-item" onclick="openChat('${user.uid}', '${user.name}', '${imageUrl}', '${user.studentId || ''}')"><img src="${imageUrl}" class="match-avatar"><div class="match-info"><h4>${user.name} <small>(${user.studentId || ''})</small></h4><p>${user.faculty}・${user.grade}</p></div></div>`;
                    });
                });
                if (matchList.innerHTML === "") { matchList.innerHTML = "表示できるマッチング相手がいません。"; }
            } catch (error) { console.error("マッチングリストの取得に失敗しました:", error); matchList.innerHTML = "情報の取得に失敗しました。"; }
        }
        
        function openChat(targetUserId, targetUserName, targetUserPhotoURL, targetUserStudentId) {
            if (!loggedInUserId || !targetUserId) { alert("エラー: ユーザー情報が不完全なため、チャットを開始できません。ページを再読み込みしてください。"); return; }
            currentChatRoomId = [loggedInUserId, targetUserId].sort().join('_');
            document.getElementById('chat-partner-name').textContent = `${targetUserName} (${targetUserStudentId || ''})`;
            showTab('chat-screen');
            renderMessages(currentChatRoomId);
        }

        function renderMessages(chatRoomId) {
            const messagesContainer = document.getElementById('messages-container');
            messagesContainer.innerHTML = '';
            const q = db.collection('chats').doc(chatRoomId).collection('messages').orderBy('timestamp', 'asc');
            unsubscribeChat = q.onSnapshot(snapshot => {
                messagesContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const bubble = document.createElement('div');
                    bubble.className = 'message-bubble';
                    bubble.textContent = msg.text;
                    if (msg.senderId === loggedInUserId) { bubble.classList.add('sent'); } else { bubble.classList.add('received'); }
                    messagesContainer.appendChild(bubble);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, error => { console.error("メッセージの受信に失敗しました:", error); });
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text === '' || !currentChatRoomId || !loggedInUserId) return;
            try {
                await db.collection('chats').doc(currentChatRoomId).collection('messages').add({ text: text, senderId: loggedInUserId, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                input.value = '';
            } catch (error) { console.error("メッセージの送信に失敗しました:", error); alert("メッセージの送信に失敗しました。"); }
        }
        
        window.onload = function() { if (auth.isSignInWithEmailLink(window.location.href)) { handleEmailLinkSignIn(); } };
        
        // ★★★ この関数を修正しました ★★★
        auth.onAuthStateChanged(async (user) => { 
            if (user) { 
                const userDoc = await db.collection('users').doc(user.uid).get(); 
                if (userDoc.exists) { 
                    // ▼▼▼ ここから修正 ▼▼▼
                    const userData = userDoc.data();
                    // ユーザーデータにstudentIdがなく、メールアドレス情報が取得できる場合
                    if (!userData.studentId && user.email) {
                        // メールアドレスからstudentIdを生成
                        const studentId = user.email.split('@')[0];
                        // Firestoreのユーザー情報を更新
                        await db.collection('users').doc(user.uid).update({ studentId: studentId });
                        console.log(`古いユーザーデータ(UID: ${user.uid})にstudentIdを補完しました。`);
                    }
                    // ▲▲▲ ここまで修正 ▲▲▲
                    loggedInUserId = user.uid; 
                    await loadUsersForCards(); 
                    showTab('main-screen'); 
                } else { 
                    showTab('profile-setup-screen'); 
                } 
            } else { 
                loggedInUserId = null; 
                allUsers = []; 
                currentUserIndex = 0; 
                showTab('login-screen'); 
            } 
        });

        async function handleEmailLinkSignIn() { let email = window.localStorage.getItem('emailForSignIn'); if (!email) { email = window.prompt('認証を完了するため、メールアドレスを再度入力してください。'); } try { await auth.signInWithEmailLink(email, window.location.href); window.localStorage.removeItem('emailForSignIn'); } catch (error) { alert('ログインに失敗しました: ' + error.message); showTab('login-screen'); } }
        function sendSignInLink() { const email = document.getElementById('email-input').value.replace(/\s/g, ''); if (!email.endsWith('@s.akashi.ac.jp')) { alert('登録できるのは "@s.akashi.ac.jp" のメールアドレスのみです。'); return; } const actionCodeSettings = { url: window.location.href, handleCodeInApp: true }; auth.sendSignInLinkToEmail(email, actionCodeSettings).then(() => { window.localStorage.setItem('emailForSignIn', email); alert(`認証用のリンクを ${email} に送信しました。メールを確認してください。`); }).catch(error => alert('メールの送信に失敗しました: ' + error.message)); }
        function handleLogout() { const msg = "一度ログアウトすると、セキュリティ上の理由により、同じメールアドレスで次にログインできるまで時間がかかる場合があります。\n本当によろしいですか？"; if (confirm(msg)) auth.signOut(); }
        function renderAvatarSelectionGrid(gridId, currentAvatarUrl = null) { const grid = document.getElementById(gridId); grid.innerHTML = ''; avatarUrls.forEach(url => { const img = document.createElement('img'); img.src = url; img.className = 'avatar-option'; img.dataset.url = url; if (url === currentAvatarUrl) { img.classList.add('selected'); } img.onclick = () => { document.querySelectorAll(`#${gridId} .avatar-option`).forEach(el => el.classList.remove('selected')); img.classList.add('selected'); }; grid.appendChild(img); }); }
        async function handleDeleteAccount() { const user = auth.currentUser; if (!user) return; if (!confirm("本当にアカウントを削除しますか？この操作は取り消せません。")) return; try { await db.collection('users').doc(user.uid).delete(); const myLikes = await db.collection('likes').where('from', '==', user.uid).get(); for(const doc of myLikes.docs) await doc.ref.delete(); const likedBy = await db.collection('likes').where('to', '==', user.uid).get(); for(const doc of likedBy.docs) await doc.ref.delete(); await user.delete(); alert('アカウントが削除されました。'); } catch (e) { console.error("アカウント削除エラー:", e); alert('アカウントの削除に失敗しました。再ログインが必要な場合があります。'); } }
        
        async function loadUsersForCards() {
            if (!loggedInUserId) return;
            try {
                const myLikesSnapshot = await db.collection('likes').where('from', '==', loggedInUserId).get();
                const swipedUserIds = myLikesSnapshot.docs.map(doc => doc.data().to);
                const usersSnapshot = await db.collection('users').get();
                allUsers = usersSnapshot.docs.map(doc => doc.data()).filter(user => user.uid !== loggedInUserId && !swipedUserIds.includes(user.uid));
                currentUserIndex = 0;
                renderCurrentCard();
            } catch (error) { console.error("ユーザーの読み込みに失敗しました:", error); }
        }
        
        function handleNope() {
            if (currentUserIndex >= allUsers.length) return;
            currentUserIndex++;
            renderCurrentCard();
        }
        
        async function handleLikeClick() {
            if (currentUserIndex >= allUsers.length || !loggedInUserId) return;
            const targetUser = allUsers[currentUserIndex];
            if (!targetUser || !targetUser.uid) { console.error("ターゲットユーザーのUIDが不正です:", targetUser); return; }
            try {
                await db.collection('likes').add({ from: loggedInUserId, to: targetUser.uid });
                const query = db.collection('likes').where('from', '==', targetUser.uid).where('to', '==', loggedInUserId);
                const result = await query.get();
                if (!result.empty) { alert(`🎉 ${targetUser.name}さんとマッチングしました！`); }
                currentUserIndex++;
                renderCurrentCard();
            } catch (error) { console.error("Like処理でエラーが発生しました:", error); }
        }

        async function reportUser(userId, userName) {
            const reason = prompt(`"${userName}"さんを通報します。理由を入力してください。(例: 不適切なプロフィール画像)`); 
            if (reason && reason.trim() !== '' && loggedInUserId) { 
                await db.collection('reports').add({ reportedUserId: userId, reporterId: loggedInUserId, reason: reason, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); 
                alert('通報が送信されました。ご協力ありがとうございます。'); 
                handleNope(); 
            } 
        }
        
        function renderProfileEditor() {
            if (!loggedInUserId) return;
            const interestsEditor = document.getElementById('profile-interests-editor'); 
            interestsEditor.innerHTML = "<p>情報を読み込み中...</p>"; 
            db.collection('users').doc(loggedInUserId).get().then(doc => { 
                if (!doc.exists) return; 
                const userData = doc.data(); 
                const myInterests = userData.interests || []; 
                interestsEditor.innerHTML = ''; 
                allInterests.forEach(interest => { 
                    interestsEditor.innerHTML += `<label style="display: inline-block; margin: 5px;"><input type="checkbox" value="${interest}" ${myInterests.includes(interest) ? 'checked' : ''}> ${interest}</label>`; 
                }); 
                renderAvatarSelectionGrid('avatar-edit-grid', userData.photoURL); 
            }).catch(error => console.error("プロフィール情報の読み込みエラー:", error));
        }

        function updateInterests() {
            if (!loggedInUserId) return;
            const selected = []; 
            document.querySelectorAll('#profile-interests-editor input:checked').forEach(c => selected.push(c.value)); 
            db.collection('users').doc(loggedInUserId).update({ interests: selected }).then(() => alert('興味タグを更新しました！')).catch(error => alert("更新に失敗しました: " + error.message));
        }

        function updateAvatar() {
            if (!loggedInUserId) return;
            const selectedAvatar = document.querySelector('#avatar-edit-grid .avatar-option.selected'); 
            if (!selectedAvatar) { alert('新しいアバターを選択してください。'); return; } 
            const newPhotoURL = selectedAvatar.dataset.url; 
            db.collection('users').doc(loggedInUserId).update({ photoURL: newPhotoURL }).then(() => alert('アバターを更新しました！')).catch(error => alert("更新に失敗しました: " + error.message));
        }
    </script>
</body>
</html>
