<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>孤選 (Kosen)</title>
    <style>
        :root { --theme-pink: #FD3A73; --bg-dark: #121212; --card-dark: #242424; --text-light: #FFFFFF; --text-muted: #B3B3B3; }
        html, body { 
            margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #000; color: var(--text-light); width: 100%; height: 100%; 
        }
        * { box-sizing: border-box; }
        #app-wrapper { max-width: 480px; margin: 0 auto; height: 100%; position: relative; overflow: hidden; background-color: var(--bg-dark); box-shadow: 0 0 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .screen { display: none; width: 100%; flex-grow: 1; flex-direction: column; min-height: 0; }
        .screen.active { display: flex; }
        .app-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        #card-stack { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .profile-card { position: absolute; width: 90vw; max-width: 380px; height: 75vh; max-height: 600px; background: var(--card-dark); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; transition: transform 0.4s ease, opacity 0.4s ease; }
        .profile-card.exit-nope { transform: translateX(-150%) rotate(-30deg); opacity: 0; }
        .profile-card.exit-like { transform: translateX(150%) rotate(30deg); opacity: 0; }
        .profile-pic { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .profile-info { position: relative; z-index: 2; padding: 25px; background: linear-gradient(to top, rgba(0,0,0,0.95) 30%, transparent); }
        .profile-header { display: flex; justify-content: space-between; align-items: center; }
        .profile-info h3 { font-size: 28px; margin: 0; }
        .profile-info h3 small { font-size: 0.5em; color: var(--text-muted); margin-left: 8px; }
        .profile-info p { font-size: 18px; margin: 5px 0 10px; color: var(--text-muted); }
        .profile-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .profile-tag { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px; padding: 5px 12px; font-size: 14px; }
        .daily-topic-area { background: rgba(255, 255, 255, 0.05); border-left: 3px solid var(--theme-pink); border-radius: 8px; padding: 12px; margin-top: 15px; }
        .daily-topic-area .question { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .daily-topic-area .answer { font-size: 15px; color: var(--text-light); }
        .actions { display: flex; justify-content: space-evenly; align-items: center; padding: 15px 0; }
        .action-btn { background: var(--card-dark); border: 1px solid #444; border-radius: 50%; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.1); }
        .action-btn svg { width: 35px; height: 35px; }
        .nope svg { stroke: #FD5068; }
        .like svg { stroke: #2DB97B; }
        #no-more-cards { text-align: center; color: var(--text-muted); padding: 20px; }
        .user-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; }
        nav { width: 100%; background: var(--card-dark); display: flex; justify-content: space-around; padding: 5px 0; border-top: 1px solid #333; }
        nav button { background: none; border: none; cursor: pointer; color: #777; padding: 10px; flex-grow: 1; }
        nav button.active { color: var(--theme-pink); }
        nav svg { width: 28px; height: 28px; }
        .login-container { flex-grow: 1; justify-content: center; align-items: center; padding: 20px; text-align: center; display: flex; flex-direction: column; }
        .login-container h1 { font-size: 48px; font-weight: bold; letter-spacing: 2px; }
        .login-container p { color: var(--text-muted); }
        .login-container input, .login-container select { width: 100%; max-width: 300px; border-radius: 25px; text-align: center; background-color: var(--card-dark); color: var(--text-light); border: 1px solid #444; padding: 12px; margin-bottom: 10px;}
        .login-container button { width: 100%; max-width: 300px; border-radius: 25px; background: linear-gradient(90deg, #FD297B, #FF655B); border: none; padding: 12px; color: white; font-weight: bold; cursor: pointer; }
        .login-container button:disabled { background: #555; cursor: not-allowed; }
        .list-container { width: 100%; flex-grow: 1; overflow-y: auto; padding: 20px 20px 80px; }
        .list-container h2 { color: var(--theme-pink); }
        .match-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; cursor: pointer; position: relative; } 
        .match-avatar { width: 60px; height: 60px; border-radius: 50%; background-color: #333; margin-right: 15px; object-fit: cover; }
        .profile-edit-section { margin-bottom: 2em; }
        .profile-edit-section button { background: var(--theme-pink); border: none; padding: 12px; font-weight: bold; border-radius: 25px; color: white; cursor: pointer;}
        .profile-edit-section .delete-button { background: #dc3545; }
        .profile-edit-section .logout-button { background: #6c757d; }
        #avatar-selection-grid, #avatar-edit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 300px; margin: 1em auto; }
        .avatar-option { width: 100%; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color 0.2s; }
        .avatar-option.selected { border-color: var(--theme-pink); }
        .chat-header { display: flex; align-items: center; padding: 10px; background-color: var(--card-dark); border-bottom: 1px solid #333; }
        .chat-back-btn { background: none; border: none; color: var(--text-light); margin-right: 10px; cursor: pointer; }
        .chat-header h2 { font-size: 1.2em; margin: 0; }
        .messages-container { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        .message-bubble { max-width: 70%; padding: 10px 15px; border-radius: 20px; margin-bottom: 10px; line-height: 1.4; word-break: break-word; }
        .message-bubble.sent { background-color: var(--theme-pink); align-self: flex-end; }
        .message-bubble.received { background-color: #3e3e3e; align-self: flex-start; }
        .chat-input-area { display: flex; padding: 10px; background-color: var(--card-dark); border-top: 1px solid #333; }
        #chat-input { flex-grow: 1; background-color: #3e3e3e; border: none; color: var(--text-light); border-radius: 20px; padding: 10px 15px; }
        #chat-send-btn { background: none; border: none; color: var(--theme-pink); padding: 10px; cursor: pointer; }
        .match-user-action-btn { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 10px; font-size: 20px; line-height: 1; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1em;}
        .tag-checkbox-label { background: #3e3e3e; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 14px; display: inline-block; margin: 3px; }
        .tag-checkbox-label input { display: none; }
        .tag-checkbox-label.checked { background: var(--theme-pink); color: white;}
        #custom-interest-adder { display: flex; gap: 8px; }
        #custom-interest-input { flex-grow: 1; background: #3e3e3e; border-radius: 15px; padding: 8px 12px; border: 1px solid #555; color: white;}
        #add-interest-btn { background: #555; color: white; border: none; border-radius: 15px; padding: 8px 15px; cursor: pointer; }
        .profile-edit-section textarea { width: 100%; max-width: 300px; background: #3e3e3e; border-radius: 15px; padding: 12px; border: 1px solid #555; color: white; min-height: 80px; margin-top: 0.5em;}
        .game-container { text-align: center; padding: 10px; }
        #pong-canvas { background-color: #000; border: 2px solid var(--theme-pink); max-width: 100%; }
        .game-ui { display: flex; justify-content: space-around; align-items: center; padding: 10px 0; }
        .game-ui button, .play-game-button { background: var(--theme-pink); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 16px; cursor: pointer; }
        #game-score { font-size: 24px; font-weight: bold; }
        .ranking-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        .ranking-rank { font-size: 20px; font-weight: bold; color: var(--text-muted); width: 40px; text-align: center; }
        .ranking-avatar { width: 50px; height: 50px; border-radius: 50%; margin: 0 15px; object-fit: cover; }
        .ranking-info { flex-grow: 1; }
        .ranking-score { font-size: 22px; font-weight: bold; color: var(--theme-pink); }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div id="login-screen" class="screen active"><div class="login-container"><h1>孤選</h1><p>学校のメールアドレスでログイン/登録</p><input type="email" id="email-input" placeholder="sXXXXX@s.akashi.ac.jp"><button id="send-link-btn" onclick="sendSignInLink()">認証メールを送信</button><p id="login-message" style="font-size: 0.9em; margin-top: 1em; height: 2.5em; color: var(--text-muted);"></p></div></div>
        <div id="profile-setup-screen" class="screen"><div class="login-container"><h1>ようこそ！</h1><p>はじめにプロフィールを設定してください</p><p style="font-size: 0.9em; margin-top: 1.5em;">好きなアバターを選んでください</p><div id="avatar-selection-grid"></div><input type="text" id="register-name" placeholder="ニックネーム"><select id="register-faculty"><option value="機械工学科">M科</option><option value="電気情報工学科">E科</option><option value="都市システム工学科">C科</option><option value="建築学科">A科</option></select><select id="register-grade"><option value="1年">1年</option><option value="2年">2年</option><option value="3年">3年</option><option value="4年">4年</option><option value="5年">5年</option><option value="専攻科1年">専攻科1年</option><option value="専攻科2年">専攻科2年</option></select><button onclick="handleProfileSetup()" id="setup-button">登録して利用を開始する</button></div></div>
        <div id="main-screen" class="screen"><div class="app-container"><div id="card-stack"></div><div id="actions-area" class="actions"><div class="action-btn nope" onclick="handleNope()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></div><div class="action-btn like" onclick="handleLikeClick()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg></div></div></div><nav id="main-nav"></nav></div>
        <div id="matches-screen" class="screen"><div class="list-container"><h2>マッチング一覧</h2><div id="match-list"></div></div><nav id="matches-nav"></nav></div>
        <div id="profile-screen" class="screen"><div class="list-container"><div class="profile-edit-section"><h2>アバターの変更</h2><div id="avatar-edit-grid"></div><button onclick="updateAvatar()">アバターを更新</button></div><div class="profile-edit-section"><h2>興味・関心タグ</h2><div id="profile-interests-editor" class="tag-container"></div><div id="custom-interest-adder"><input type="text" id="custom-interest-input" placeholder="タグを自由に追加"><button id="add-interest-btn" onclick="addCustomInterest()">追加</button></div><button onclick="updateInterests()" style="margin-top: 1em;">興味タグを更新</button></div><div class="profile-edit-section"><h2>今日のひとこと</h2><p id="daily-topic-question-editor" style="color: var(--text-muted);"></p><textarea id="daily-topic-answer-input" placeholder="回答を入力..."></textarea><button onclick="updateDailyAnswer()">ひとことを更新</button></div><div class="profile-edit-section"><h2>アカウント設定</h2><button class="logout-button" onclick="handleLogout()">ログアウト</button><button class="delete-button" onclick="handleDeleteAccount()">アカウントを完全に削除する</button></div></div><nav id="profile-nav"></nav></div>
        <div id="chat-screen" class="screen"><div class="chat-header"><button class="chat-back-btn" onclick="showTab('matches-screen')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg></button><h2 id="chat-partner-name">相手の名前</h2></div><div class="messages-container" id="messages-container"></div><div class="chat-input-area"><input type="text" id="chat-input" placeholder="メッセージを入力..."><button id="chat-send-btn" onclick="sendMessage()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg></button></div></div>

        <div id="pong-game-screen" class="screen">
            <div class="app-container game-container">
                <h2>Pong ゲーム</h2>
                <div id="game-score">0 - 0</div>
                <canvas id="pong-canvas"></canvas> <!-- widthとheightはJSで設定 -->
                <div class="game-ui">
                    <button id="start-game-btn" onclick="startPongGame()">ゲーム開始</button>
                </div>
                <p style="color: var(--text-muted); font-size: 0.8em; margin-top: 15px;">マウスか指でパドルを動かしてね</p>
            </div>
            <nav id="game-nav"></nav>
        </div>

        <div id="ranking-screen" class="screen">
            <div class="list-container">
                <h2>ハイスコアランキング</h2>
                <!-- ★★★ 修正点: ゲームをプレイするためのボタンをここに追加 ★★★ -->
                <button class="play-game-button" onclick="showTab('pong-game-screen')" style="width: 100%; margin-bottom: 20px;">ゲームをプレイする</button>
                <div id="ranking-list"></div>
            </div>
            <nav id="ranking-nav"></nav>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyAcKf5BrhFFkv74WdaamqnrCY1qSRxsVjE", authDomain: "deaikei-kosen.firebaseapp.com", projectId: "deaikei-kosen", storageBucket: "deaikei-kosen.firebasestorage.app", messagingSenderId: "166298285211", appId: "1:166298285211:web:5381e5e419754e0376c23e" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
    <script>
        let loggedInUserId = null, allUsers = [], currentUserIndex = 0;
        let currentChatRoomId = null, unsubscribeChat = null;
        let userInterestsCache = [];

        const navHTML = `
            <button onclick="showTab('main-screen')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12.75 2.25A2.25 2.25 0 0010.5 4.5v15a2.25 2.25 0 002.25 2.25h.518a.75.75 0 00.74-1.023l-.26-1.037a1.5 1.5 0 011.025-1.742 1.5 1.5 0 011.742 1.025l.26 1.037a.75.75 0 00.74 1.023h.518a2.25 2.25 0 002.25-2.25v-15a2.25 2.25 0 00-2.25-2.25H12.75zM12 4.5h6.75v15H12V4.5zM3.75 6A2.25 2.25 0 001.5 8.25v9A2.25 2.25 0 003.75 19.5h.518a.75.75 0 00.74-1.023l-.26-1.037a1.5 1.5 0 011.025-1.742 1.5 1.5 0 011.742 1.025l.26 1.037A.75.75 0 008.482 19.5h.518A2.25 2.25 0 0011.25 17.25v-9A2.25 2.25 0 009 6H3.75zM3 8.25h6.75v9H3v-9z" /></svg></button>
            <button onclick="showTab('matches-screen')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M4.848 2.771A49.144 49.144 0 0112 2.25c2.43 0 4.817.178 7.152.52 1.978.292 3.348 2.024 3.348 3.97v6.02c0 1.946-1.37 3.678-3.348 3.97a48.901 48.901 0 01-3.476.383.39.39 0 00-.297.17l-2.755 4.133a.75.75 0 01-1.248 0l-2.755-4.133a.39.39 0 00-.297-.17 48.9 48.9 0 01-3.476-.384c-1.978-.29-3.348-2.024-3.348-3.97V6.741c0-1.946 1.37-3.68 3.348-3.97zM6.75 8.25a.75.75 0 01.75-.75h9a.75.75 0 010 1.5h-9a.75.75 0 01-.75-.75zm.75 2.25a.75.75 0 000 1.5H12a.75.75 0 000-1.5H7.5z" clip-rule="evenodd" /></svg></button>
            <button onclick="showTab('ranking-screen')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:32px; height:32px;"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-6.75c-.621 0-1.125.504-1.125 1.125V18.75m9 0h-9" /><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 21.75h4.5m-4.5 0a3 3 0 01-3-3h-1.5a3 3 0 01-3-3V11.25a3 3 0 013-3h1.5a3 3 0 013 3v7.5m0-7.5h4.5m-4.5 0v-1.5a3 3 0 013-3h1.5a3 3 0 013 3v1.5m0 0h1.5a3 3 0 013 3v3.75a3 3 0 01-3 3h-1.5a3 3 0 01-3-3v-3.75m-4.5 0h4.5" /></svg></button>
            <button onclick="showTab('profile-screen')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" clip-rule="evenodd" /></svg></button>
        `;
        document.querySelectorAll('nav').forEach(nav => nav.innerHTML = navHTML);
        
        const avatarUrls = [ '/Deaikei/images/account.png', '/Deaikei/images/astronaut.png', '/Deaikei/images/bakeneko.png', '/Deaikei/images/cat.png', '/Deaikei/images/dog (1).png', '/Deaikei/images/dog.png', '/Deaikei/images/fish.png', '/Deaikei/images/kappa.png', '/Deaikei/images/man.png', '/Deaikei/images/meerkat.png', '/Deaikei/images/oni.png', '/Deaikei/images/student.png', '/Deaikei/images/tanuki.png', '/Deaikei/images/teenager (1).png', '/Deaikei/images/teenager (2).png', '/Deaikei/images/teenager.png', '/Deaikei/images/turtle.png', '/Deaikei/images/user (1).png', '/Deaikei/images/user.png', '/Deaikei/images/woman.png' ];
        const dailyTopics = ["今一番ハマっていることは？", "おすすめの学食メニューは？", "最近見た面白い動画やアニメは？", "週末は何して過ごすことが多い？", "得意な科目・苦手な科目は？", "もし1日だけ誰かになれるとしたら誰になる？", "好きな音楽のジャンルやアーティストは？", "人生で一番笑ったエピソードは？", "卒業したらやってみたいことは？", "学校の近くでおすすめの場所は？"];
        const getDailyTopic = () => { const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24)); return dailyTopics[dayOfYear % dailyTopics.length]; };
        const allInterests = ["プログラミング", "機械学習", "電子工作", "設計", "実験", "ロボコン", "Python", "Java", "C++", "JavaScript", "CAD", "3Dプリンタ", "VR/AR", "ドローン", "Web制作", "アプリ開発", "デザイン", "映像制作", "DTM", "ゲーム制作", "eスポーツ", "バスケ", "サッカー", "テニス", "バドミントン", "野球", "陸上", "音楽", "軽音", "吹奏楽", "バンド", "ギター", "ピアノ", "写真", "筋トレ", "料理", "お菓子作り", "アニメ", "漫画", "ゲーム", "イラスト", "映画鑑賞", "読書", "旅行", "ツーリング", "資格勉強", "TOEIC", "インターン", "起業したい", "ボランティア", "バイク"];
        const sanitizeHTML = (str) => { const temp = document.createElement('div'); temp.textContent = str; return temp.innerHTML; };

        // 認証フロー
        (function() { if (auth.isSignInWithEmailLink(window.location.href)) handleEmailLinkSignIn(); })();
        auth.onAuthStateChanged(async (user) => { if (user) { const userDoc = await db.collection('users').doc(user.uid).get(); if (userDoc.exists) { const userData = userDoc.data(); if (!userData.studentId && user.email) { await db.collection('users').doc(user.uid).update({ studentId: user.email.split('@')[0] }); } loggedInUserId = user.uid; await loadUsersForCards(); showTab('main-screen'); } else { showTab('profile-setup-screen'); } } else { loggedInUserId = null; allUsers = []; currentUserIndex = 0; showTab('login-screen'); } });
        
        function showTab(screenId) {
            if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
            stopPongGame(); 
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const screen = document.getElementById(screenId);
            if (screen) screen.classList.add('active');
            if (screenId === 'profile-setup-screen') renderAvatarSelectionGrid('avatar-selection-grid');
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            const navs = document.querySelectorAll('nav');
            if (screenId === 'main-screen') navs.forEach(nav => nav.children[0].classList.add('active'));
            if (screenId === 'matches-screen') navs.forEach(nav => nav.children[1].classList.add('active'));
            if (screenId === 'ranking-screen' || screenId === 'pong-game-screen') navs.forEach(nav => nav.children[2].classList.add('active'));
            if (screenId === 'profile-screen') navs.forEach(nav => nav.children[3].classList.add('active'));
            
            if (screenId === 'matches-screen') renderMatches();
            if (screenId === 'profile-screen') renderProfileEditor();
            if (screenId === 'ranking-screen') renderRanking();
            if (screenId === 'pong-game-screen') initPongGame();
        }

        async function handleProfileSetup() { const name = document.getElementById('register-name').value.trim(); if (!name) { alert('ニックネームは必須です。'); return; } const selectedAvatar = document.querySelector('#avatar-selection-grid .avatar-option.selected'); let avatarUrl = selectedAvatar ? selectedAvatar.dataset.url : '/Deaikei/images/user (1).png'; const user = auth.currentUser; if (!user) return; const studentId = user.email.split('@')[0]; const profileData = { uid: user.uid, studentId: studentId, name: name, photoURL: avatarUrl, faculty: document.getElementById('register-faculty').value, grade: document.getElementById('register-grade').value, interests: [], isBanned: false, blockedUsers: [], pongHighScore: 0 }; await db.collection('users').doc(user.uid).set(profileData); await loadUsersForCards(); showTab('main-screen'); }
        async function loadUsersForCards() { if (!loggedInUserId) return; const stack = document.getElementById('card-stack'); stack.innerHTML = "<p>ユーザーを探しています...</p>"; try { const myDoc = await db.collection('users').doc(loggedInUserId).get(); const myData = myDoc.data() || {}; const myBlockedUsers = myData.blockedUsers || []; const myLikesSnapshot = await db.collection('likes').where('from', '==', loggedInUserId).get(); const swipedUserIds = myLikesSnapshot.docs.map(doc => doc.data().to); swipedUserIds.push(...myBlockedUsers); const usersSnapshot = await db.collection('users').get(); allUsers = usersSnapshot.docs.map(doc => doc.data()).filter(user => user && user.uid && user.uid !== loggedInUserId && !user.isBanned && !swipedUserIds.includes(user.uid) && !(user.blockedUsers && user.blockedUsers.includes(loggedInUserId))); currentUserIndex = 0; renderCurrentCard(); } catch (error) { console.error("ユーザー読み込みエラー:", error); stack.innerHTML = "<p>ユーザー情報の取得に失敗しました。</p>"; } }
        function renderCurrentCard() { const stack = document.getElementById('card-stack'); const actions = document.getElementById('actions-area'); if (currentUserIndex >= allUsers.length) { stack.innerHTML = `<div id="no-more-cards"><h3>表示できる相手がいません。</h3><p>時間をおいて再度お試しください。</p></div>`; actions.style.display = 'none'; return; } actions.style.display = 'flex'; const user = allUsers[currentUserIndex]; const imageUrl = user.photoURL || '/Deaikei/images/user (1).png'; const safeName = sanitizeHTML(user.name); const safeStudentId = sanitizeHTML(user.studentId || ''); const safeFaculty = sanitizeHTML(user.faculty); const safeGrade = sanitizeHTML(user.grade); const tagsHTML = (user.interests || []).map(tag => `<div class="profile-tag">${sanitizeHTML(tag)}</div>`).join(''); let dailyTopicHTML = ''; if (user.dailyAnswer && user.dailyTopicQuestion) { dailyTopicHTML = `<div class="daily-topic-area"><div class="question">${sanitizeHTML(user.dailyTopicQuestion)}</div><div class="answer">${sanitizeHTML(user.dailyAnswer)}</div></div>`; } stack.innerHTML = `<div class="profile-card" data-user-id="${user.uid}"><img src="${imageUrl}" class="profile-pic"><div class="profile-info"><div class="profile-header"><h3>${safeName} <small>(${safeStudentId})</small></h3><button class="user-action-btn" onclick="handleUserAction('${user.uid}', '${user.name}')">•••</button></div><p>${safeFaculty}・${safeGrade}</p><div class="profile-tags">${tagsHTML}</div>${dailyTopicHTML}</div></div>`; }
        async function handleNope() { if (currentUserIndex >= allUsers.length) return; const card = document.querySelector('.profile-card'); if (card) { card.classList.add('exit-nope'); const targetUser = allUsers[currentUserIndex]; if (targetUser && targetUser.uid) { await db.collection('likes').add({ from: loggedInUserId, to: targetUser.uid, type: 'nope' }); } setTimeout(() => { currentUserIndex++; renderCurrentCard(); }, 400); } }
        async function handleLikeClick() { if (currentUserIndex >= allUsers.length || !loggedInUserId) return; const targetUser = allUsers[currentUserIndex]; if (!targetUser || !targetUser.uid) { console.error("Invalid target user data. Skipping."); currentUserIndex++; renderCurrentCard(); return; } const card = document.querySelector('.profile-card'); if (card) { card.classList.add('exit-like'); try { await db.collection('likes').add({ from: loggedInUserId, to: targetUser.uid }); const result = await db.collection('likes').where('from', '==', targetUser.uid).where('to', '==', loggedInUserId).get(); if (!result.empty) { alert(`🎉 ${targetUser.name}さんとマッチングしました！`); } setTimeout(() => { currentUserIndex++; renderCurrentCard(); }, 400); } catch (error) { console.error("Like処理エラー:", error); setTimeout(() => { currentUserIndex++; renderCurrentCard(); }, 400); } } }
        
        // Pong Game Logic
        const pongCanvas = document.getElementById('pong-canvas');
        const pongCtx = pongCanvas.getContext('2d');
        let gameLoopId;
        const paddleWidth = 10, paddleHeight = 100;
        let player, cpu, ball;

        // ★★★ 修正点: キャンバスをレスポンシブにする関数 ★★★
        function resizePongCanvas() {
            const container = pongCanvas.parentElement;
            const size = Math.min(container.clientWidth * 0.9, 400); // PCでも最大400px
            pongCanvas.width = size;
            pongCanvas.height = size * 1.25; // 縦横比を維持 (400x500)
            paddleHeight = pongCanvas.height / 5;
        }

        window.addEventListener('resize', resizePongCanvas);

        function initPongGame() {
            resizePongCanvas(); // 画面表示時にサイズを調整
            const canvas = pongCanvas;
            player = { x: 10, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, score: 0 };
            cpu = { x: canvas.width - 20, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, score: 0 };
            ball = { x: canvas.width / 2, y: canvas.height / 2, radius: 8, speed: 5, velX: 5, velY: 5 };
            document.getElementById('start-game-btn').style.display = 'block';
            document.getElementById('game-score').textContent = "0 - 0";
            drawPongGame();
        }
        function startPongGame() { if (gameLoopId) return; document.getElementById('start-game-btn').style.display = 'none'; player.score = 0; cpu.score = 0; resetBall(); gameLoopId = requestAnimationFrame(updatePongGame); }
        function stopPongGame() { if (gameLoopId) { cancelAnimationFrame(gameLoopId); gameLoopId = null; } }
        function drawRect(x, y, w, h, color) { pongCtx.fillStyle = color; pongCtx.fillRect(x, y, w, h); }
        function drawCircle(x, y, r, color) { pongCtx.fillStyle = color; pongCtx.beginPath(); pongCtx.arc(x, y, r, 0, Math.PI*2, false); pongCtx.closePath(); pongCtx.fill(); }
        function drawNet() { for(let i=0; i < pongCanvas.height; i+=15) { drawRect(pongCanvas.width/2 - 1, i, 2, 10, "WHITE"); } }
        function drawPongGame() { drawRect(0, 0, pongCanvas.width, pongCanvas.height, "#121212"); drawNet(); drawRect(player.x, player.y, player.width, player.height, "WHITE"); drawRect(cpu.x, cpu.y, cpu.width, cpu.height, "WHITE"); drawCircle(ball.x, ball.y, ball.radius, "WHITE"); document.getElementById('game-score').textContent = `${player.score} - ${cpu.score}`; }
        function resetBall() { ball.x = pongCanvas.width / 2; ball.y = pongCanvas.height / 2; ball.velX = -ball.velX; ball.speed = 5; }
        function updatePongGame() { ball.x += ball.velX; ball.y += ball.velY; const cpuLevel = 0.08 + (player.score * 0.005); cpu.y += (ball.y - (cpu.y + cpu.height/2)) * cpuLevel; if(ball.y + ball.radius > pongCanvas.height || ball.y - ball.radius < 0) { ball.velY = -ball.velY; } let p = (ball.x < pongCanvas.width/2) ? player : cpu; if (collision(ball, p)) { let collidePoint = (ball.y - (p.y + p.height/2)); collidePoint = collidePoint / (p.height/2); let angleRad = (Math.PI/4) * collidePoint; let direction = (ball.x < pongCanvas.width/2) ? 1 : -1; ball.velX = direction * ball.speed * Math.cos(angleRad); ball.velY = ball.speed * Math.sin(angleRad); ball.speed += 0.2; } if (ball.x - ball.radius < 0) { cpu.score++; if (cpu.score >= 5) { gameOver(false); return; } resetBall(); } else if (ball.x + ball.radius > pongCanvas.width) { player.score++; updateHighScore(player.score); resetBall(); } drawPongGame(); gameLoopId = requestAnimationFrame(updatePongGame); }
        function collision(b, p) { p.top = p.y; p.bottom = p.y + p.height; p.left = p.x; p.right = p.x + p.width; b.top = b.y - b.radius; b.bottom = b.y + b.radius; b.left = b.x - b.radius; b.right = b.x + b.radius; return p.left < b.right && p.top < b.bottom && p.right > b.left && p.bottom > b.top; }
        async function gameOver(playerWon) { stopPongGame(); const message = playerWon ? `あなたの勝ちです！ スコア: ${player.score}` : `CPUの勝ちです。最終スコア: ${player.score}`; alert(message); document.getElementById('start-game-btn').style.display = 'block'; }
        async function updateHighScore(score) { if (!loggedInUserId || !score) return; try { const userRef = db.collection('users').doc(loggedInUserId); const doc = await userRef.get(); if (doc.exists) { const currentHighScore = doc.data().pongHighScore || 0; if (score > currentHighScore) { await userRef.update({ pongHighScore: score }); console.log(`ハイスコア更新: ${score}点`); } } } catch(error) { console.error("ハイスコア更新エラー:", error); } }
        pongCanvas.addEventListener('mousemove', e => { let rect = pongCanvas.getBoundingClientRect(); player.y = e.clientY - rect.top - player.height / 2; });
        pongCanvas.addEventListener('touchmove', e => { e.preventDefault(); let rect = pongCanvas.getBoundingClientRect(); player.y = e.touches[0].clientY - rect.top - player.height / 2; }, { passive: false });

        // Ranking Logic
        async function renderRanking() { const rankingList = document.getElementById('ranking-list'); rankingList.innerHTML = "<p>ランキングを読み込み中...</p>"; try { const snapshot = await db.collection('users').orderBy('pongHighScore', 'desc').limit(50).get(); rankingList.innerHTML = ""; if (snapshot.empty) { rankingList.innerHTML = "<p>まだ誰もプレイしていません。</p>"; return; } let rank = 1; snapshot.forEach(doc => { const user = doc.data(); if (!user.pongHighScore) return; const imageUrl = user.photoURL || '/Deaikei/images/user (1).png'; rankingList.innerHTML += `<div class="ranking-item"><div class="ranking-rank">${rank}</div><img src="${imageUrl}" class="ranking-avatar"><div class="ranking-info"><h4>${sanitizeHTML(user.name)}</h4><p>${sanitizeHTML(user.faculty)}・${sanitizeHTML(user.grade)}</p></div><div class="ranking-score">${user.pongHighScore}</div></div>`; rank++; }); } catch (error) { console.error("ランキング取得エラー:", error); rankingList.innerHTML = "<p>ランキングの取得に失敗しました。</p>"; } }
        
        // Other Helper Functions
        async function renderMatches() { if (!loggedInUserId) return; const matchList = document.getElementById('match-list'); matchList.innerHTML = "マッチング情報を読み込み中..."; try { const myDoc = await db.collection('users').doc(loggedInUserId).get(); const myBlockedUsers = (myDoc.data() || {}).blockedUsers || []; const myLikesSnapshot = await db.collection('likes').where('from', '==', loggedInUserId).get(); const likedByMe = myLikesSnapshot.docs.map(doc => doc.data().to); if (likedByMe.length === 0) { matchList.innerHTML = "まだマッチングした相手がいません。"; return; } const chunkedLikedByMe = []; for (let i = 0; i < likedByMe.length; i += 10) { chunkedLikedByMe.push(likedByMe.slice(i, i + 10)); } const matchedIds = []; for (const chunk of chunkedLikedByMe) { const likedMeBackSnapshot = await db.collection('likes').where('to', '==', loggedInUserId).where('from', 'in', chunk).get(); likedMeBackSnapshot.forEach(doc => matchedIds.push(doc.data().from)); } if (matchedIds.length === 0) { matchList.innerHTML = "まだマッチングした相手がいません。"; return; } const userPromises = matchedIds.map(id => db.collection('users').doc(id).get()); const userDocs = await Promise.all(userPromises); matchList.innerHTML = ""; userDocs.forEach(doc => { if (!doc.exists) return; const user = doc.data(); if (user.isBanned || myBlockedUsers.includes(user.uid) || (user.blockedUsers && user.blockedUsers.includes(loggedInUserId))) return; const imageUrl = user.photoURL || '/Deaikei/images/user (1).png'; const safeName = sanitizeHTML(user.name); const safeStudentId = sanitizeHTML(user.studentId || ''); const safeFaculty = sanitizeHTML(user.faculty); const safeGrade = sanitizeHTML(user.grade); matchList.innerHTML += `<div class="match-item" onclick="openChat('${user.uid}', '${user.name}', '${imageUrl}', '${user.studentId || ''}')"><img src="${imageUrl}" class="match-avatar"><div class="match-info"><h4>${safeName} <small>(${safeStudentId})</small></h4><p>${safeFaculty}・${safeGrade}</p></div><button class="match-user-action-btn" onclick="handleUserAction(event, '${user.uid}', '${user.name}')">•••</button></div>`; }); if (matchList.innerHTML === "") { matchList.innerHTML = "表示できるマッチング相手がいません。"; } } catch (error) { console.error("マッチングリスト取得エラー:", error); matchList.innerHTML = "情報の取得に失敗しました。"; } }
        async function handleUserAction(event, userId, userName) { if (event && typeof event.stopPropagation === 'function') { event.stopPropagation(); } const action = prompt(`'${userName}'さんへの操作を選択してください。\n1: ブロック\n2: 通報\n(数字を入力してください)`); if (action === '1') { blockUser(userId, userName); } else if (action === '2') { reportUser(userId, userName); } }
        async function blockUser(userId, userName) { if (!confirm(`'${userName}'さんをブロックしますか？\nブロックすると、お互いの画面に二度と表示されなくなります。`)) return; try { await db.collection('users').doc(loggedInUserId).update({ blockedUsers: firebase.firestore.FieldValue.arrayUnion(userId) }); alert(`'${userName}'さんをブロックしました。`); const card = document.querySelector('.profile-card'); if (card && card.dataset.userId === userId) { handleNope(); } if (document.getElementById('matches-screen').classList.contains('active')) { renderMatches(); } } catch (error) { console.error("ブロック処理エラー:", error); alert("ブロックに失敗しました。"); } }
        async function reportUser(userId, userName) { const reason = prompt(`'${userName}'さんを通報します。理由を入力してください。`); if (reason && reason.trim() !== '') { await db.collection('reports').add({ reportedUserId: userId, reporterId: loggedInUserId, reason: reason, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); alert('通報が送信されました。ご協力ありがとうございます。'); const card = document.querySelector('.profile-card'); if (card && card.dataset.userId === userId) { handleNope(); } } }
        async function renderProfileEditor() { if (!loggedInUserId) return; const editor = document.getElementById('profile-interests-editor'); const dailyTopicQuestionEl = document.getElementById('daily-topic-question-editor'); const dailyTopicAnswerInput = document.getElementById('daily-topic-answer-input'); editor.innerHTML = "<p>情報を読み込み中...</p>"; const doc = await db.collection('users').doc(loggedInUserId).get(); if (!doc.exists) return; const userData = doc.data(); userInterestsCache = userData.interests || []; renderInterestTags(editor, userInterestsCache); renderAvatarSelectionGrid('avatar-edit-grid', userData.photoURL); const topic = getDailyTopic(); dailyTopicQuestionEl.textContent = topic; if (userData.dailyTopicQuestion === topic) { dailyTopicAnswerInput.value = userData.dailyAnswer || ''; } else { dailyTopicAnswerInput.value = ''; } }
        async function updateDailyAnswer() { if (!loggedInUserId) return; const question = getDailyTopic(); const answer = document.getElementById('daily-topic-answer-input').value.trim(); try { await db.collection('users').doc(loggedInUserId).update({ dailyTopicQuestion: question, dailyAnswer: answer }); alert('「今日のひとこと」を更新しました！'); } catch (error) { alert("更新に失敗しました: " + error.message); } }
        function openChat(targetUserId, targetUserName, targetUserPhotoURL, targetUserStudentId) { if (!loggedInUserId || !targetUserId) return; currentChatRoomId = [loggedInUserId, targetUserId].sort().join('_'); document.getElementById('chat-partner-name').textContent = `${sanitizeHTML(targetUserName)} (${sanitizeHTML(targetUserStudentId || '')})`; showTab('chat-screen'); const messagesContainer = document.getElementById('messages-container'); messagesContainer.innerHTML = ''; const q = db.collection('chats').doc(currentChatRoomId).collection('messages').orderBy('timestamp', 'asc'); unsubscribeChat = q.onSnapshot(snapshot => { messagesContainer.innerHTML = ''; snapshot.forEach(doc => { const msg = doc.data(); const bubble = document.createElement('div'); bubble.className = 'message-bubble'; bubble.textContent = msg.text; if (msg.senderId === loggedInUserId) { bubble.classList.add('sent'); } else { bubble.classList.add('received'); } messagesContainer.appendChild(bubble); }); messagesContainer.scrollTop = messagesContainer.scrollHeight; }, error => { console.error("メッセージ受信エラー:", error); }); }
        async function sendMessage() { const input = document.getElementById('chat-input'); const text = input.value.trim(); if (text === '' || !currentChatRoomId || !loggedInUserId) return; const tempText = text; input.value = ''; try { await db.collection('chats').doc(currentChatRoomId).collection('messages').add({ text: tempText, senderId: loggedInUserId, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); } catch (error) { console.error("メッセージ送信エラー:", error); alert("メッセージの送信に失敗しました。"); input.value = tempText; } }
        function handleLogout() { if (confirm("ログアウトしますか？")) auth.signOut(); }
        async function handleDeleteAccount() { const user = auth.currentUser; if (!user) return; if (!confirm("本当にアカウントを削除しますか？\nこの操作は取り消せません。")) return; try { await db.collection('users').doc(user.uid).delete(); await user.delete(); alert('アカウントが削除されました。'); } catch (e) { console.error("アカウント削除エラー:", e); alert('アカウントの削除に失敗しました。再ログインが必要です。'); } }
        function renderAvatarSelectionGrid(gridId, currentAvatarUrl = null) { const grid = document.getElementById(gridId); grid.innerHTML = ''; avatarUrls.forEach(url => { const img = document.createElement('img'); img.src = url; img.className = 'avatar-option'; img.dataset.url = url; if (url === currentAvatarUrl) img.classList.add('selected'); img.onclick = () => { document.querySelectorAll(`#${gridId} .avatar-option`).forEach(el => el.classList.remove('selected')); img.classList.add('selected'); }; grid.appendChild(img); }); }
        function renderInterestTags(container, userTags) { const displayTags = [...new Set([...allInterests, ...userTags])].sort(); container.innerHTML = ''; displayTags.forEach(interest => { const label = document.createElement('label'); label.className = 'tag-checkbox-label'; const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.value = interest; if (userTags.includes(interest)) { checkbox.checked = true; label.classList.add('checked'); } checkbox.onchange = () => { label.classList.toggle('checked', checkbox.checked); const value = checkbox.value; if (checkbox.checked) { if (!userInterestsCache.includes(value)) userInterestsCache.push(value); } else { userInterestsCache = userInterestsCache.filter(t => t !== value); } }; label.appendChild(checkbox); label.appendChild(document.createTextNode(sanitizeHTML(interest))); container.appendChild(label); }); }
        function addCustomInterest() { const input = document.getElementById('custom-interest-input'); const newInterest = input.value.trim(); if (newInterest && !userInterestsCache.includes(newInterest)) { userInterestsCache.push(newInterest); renderInterestTags(document.getElementById('profile-interests-editor'), userInterestsCache); } input.value = ''; }
        async function updateInterests() { if (!loggedInUserId) return; try { await db.collection('users').doc(loggedInUserId).update({ interests: userInterestsCache }); alert('興味タグを更新しました！'); } catch (error) { alert("更新失敗: " + error.message); } }
        async function updateAvatar() { if (!loggedInUserId) return; const selectedAvatar = document.querySelector('#avatar-edit-grid .avatar-option.selected'); if (!selectedAvatar) { alert('新しいアバターを選択してください。'); return; } try { await db.collection('users').doc(loggedInUserId).update({ photoURL: selectedAvatar.dataset.url }); alert('アバターを更新しました！'); } catch (error) { alert("更新失敗: " + error.message); } }
        async function sendSignInLink() { const emailInput = document.getElementById('email-input'); const sendButton = document.getElementById('send-link-btn'); const messageEl = document.getElementById('login-message'); const email = emailInput.value.trim(); if (!email.endsWith('@s.akashi.ac.jp')) { messageEl.textContent = '登録できるのは "@s.akashi.ac.jp" のメールアドレスのみです。'; return; } const actionCodeSettings = { url: window.location.href, handleCodeInApp: true }; sendButton.disabled = true; messageEl.textContent = '送信中...'; try { await auth.sendSignInLinkToEmail(email, actionCodeSettings); window.localStorage.setItem('emailForSignIn', email); messageEl.textContent = `認証用のリンクを ${email} に送信しました。メールを確認してください。`; alert(`認証リンクを送信しました。\nメールを開き、このブラウザでリンクをクリックしてログインを完了してください。`); } catch (error) { console.error("メール送信エラー:", error); messageEl.textContent = 'メールの送信に失敗しました: ' + error.message; } finally { sendButton.disabled = false; } }
        async function handleEmailLinkSignIn() { const messageEl = document.getElementById('login-message'); messageEl.textContent = '認証情報を確認しています...'; let email = window.localStorage.getItem('emailForSignIn'); if (!email) { email = window.prompt('認証を完了するため、メールアドレスを再度入力してください。'); if (!email) { messageEl.textContent = '認証がキャンセルされました。'; return; } } try { await auth.signInWithEmailLink(email, window.location.href); window.localStorage.removeItem('emailForSignIn'); window.history.replaceState({}, document.title, window.location.pathname); } catch (error) { console.error("ログインエラー:", error); messageEl.textContent = 'ログインに失敗しました: ' + error.message; alert('ログインに失敗しました。'); window.history.replaceState({}, document.title, window.location.pathname); } }
