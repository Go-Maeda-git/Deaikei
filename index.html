<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>孤選 (Kosen)</title>
    <style>
        :root { --theme-pink: #FD3A73; --bg-dark: #121212; --card-dark: #242424; --text-light: #FFFFFF; --text-muted: #B3B3B3; }
        html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #000; color: var(--text-light); width: 100%; height: 100%; }
        * { box-sizing: border-box; }
        #app-wrapper { max-width: 480px; margin: 0 auto; height: 100%; position: relative; overflow: hidden; background-color: var(--bg-dark); box-shadow: 0 0 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .screen { display: none; width: 100%; flex-grow: 1; flex-direction: column; min-height: 0; }
        .screen.active { display: flex; }
        .app-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        #card-stack { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .profile-card { position: absolute; width: 90vw; max-width: 380px; height: 75vh; max-height: 600px; background: var(--card-dark); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; transition: 0.4s; }
        .profile-card.exit-nope { transform: translateX(-150%) rotate(-30deg); opacity: 0; }
        .profile-card.exit-like { transform: translateX(150%) rotate(30deg); opacity: 0; }
        .profile-pic { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .profile-info { position: relative; z-index: 2; padding: 25px; background: linear-gradient(to top, rgba(0,0,0,0.95) 30%, transparent); max-height: 60%; overflow-y: auto; }
        .profile-header { display: flex; justify-content: space-between; align-items: center; }
        .profile-info h3 { font-size: 28px; margin: 0; }
        .profile-info h3 small { font-size: 0.5em; color: var(--text-muted); margin-left: 8px; }
        .profile-info p { font-size: 18px; margin: 5px 0 10px; color: var(--text-muted); }
        .profile-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .profile-tag { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px; padding: 5px 12px; font-size: 14px; }
        .daily-topic-area { background: rgba(255, 255, 255, 0.05); border-left: 3px solid var(--theme-pink); border-radius: 8px; padding: 12px; margin-top: 15px; }
        .daily-topic-area .question { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .daily-topic-area .answer { font-size: 15px; color: var(--text-light); }
        .actions { display: flex; justify-content: space-evenly; align-items: center; padding: 15px 0; }
        .action-btn { background: var(--card-dark); border: 1px solid #444; border-radius: 50%; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.1); }
        .action-btn svg { width: 35px; height: 35px; }
        .nope svg { stroke: #FD5068; }
        .like svg { stroke: #2DB97B; }
        #no-more-cards { text-align: center; color: var(--text-muted); padding: 20px; }
        .user-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; }
        nav { width: 100%; background: var(--card-dark); display: flex; justify-content: space-around; padding: 5px 0; border-top: 1px solid #333; }
        nav button { background: none; border: none; cursor: pointer; color: #777; padding: 10px; flex-grow: 1; }
        nav button.active { color: var(--theme-pink); }
        nav svg { width: 28px; height: 28px; }
        .login-container { flex-grow: 1; justify-content: center; align-items: center; padding: 20px; text-align: center; display: flex; flex-direction: column; }
        .login-container h1 { font-size: 48px; font-weight: bold; letter-spacing: 2px; }
        .login-container p { color: var(--text-muted); }
        .login-container input, .login-container select { width: 100%; max-width: 300px; border-radius: 25px; text-align: center; background-color: var(--card-dark); color: var(--text-light); border: 1px solid #444; padding: 12px; margin-bottom: 10px;}
        .login-container button { width: 100%; max-width: 300px; border-radius: 25px; background: linear-gradient(90deg, #FD297B, #FF655B); border: none; padding: 12px; color: white; font-weight: bold; cursor: pointer; }
        .login-container button:disabled { background: #555; cursor: not-allowed; }
        #profile-setup-screen .login-container { justify-content: flex-start; overflow-y: auto; padding: 40px 20px; }
        .list-container { width: 100%; flex-grow: 1; overflow-y: auto; padding: 20px 20px 80px; }
        .list-container h2 { color: var(--theme-pink); }
        .match-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; cursor: pointer; position: relative; } 
        .match-avatar { width: 60px; height: 60px; border-radius: 50%; background-color: #333; margin-right: 15px; object-fit: cover; }
        .profile-edit-section { margin-bottom: 2em; }
        .profile-edit-section button { background: var(--theme-pink); border: none; padding: 12px; font-weight: bold; border-radius: 25px; color: white; cursor: pointer; margin-top: 0.5em; width: 100%; max-width: 300px;}
        .profile-edit-section .delete-button { background: #dc3545; }
        .profile-edit-section .logout-button { background: #6c757d; }
        .profile-edit-section .report-button { background: #ffc107; color: #121212;}
        #avatar-selection-grid, #avatar-edit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 300px; margin: 1em auto; }
        .avatar-option { width: 100%; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color 0.2s; }
        .avatar-option.selected { border-color: var(--theme-pink); }
        .chat-header { display: flex; align-items: center; padding: 10px; background-color: var(--card-dark); border-bottom: 1px solid #333; }
        .chat-back-btn { background: none; border: none; color: var(--text-light); margin-right: 10px; cursor: pointer; }
        .chat-header h2 { font-size: 1.2em; margin: 0; }
        .messages-container { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        .message-bubble { max-width: 70%; padding: 10px 15px; border-radius: 20px; margin-bottom: 10px; line-height: 1.4; word-break: break-word; }
        .message-bubble.sent { background-color: var(--theme-pink); align-self: flex-end; }
        .message-bubble.received { background-color: #3e3e3e; align-self: flex-start; }
        .chat-input-area { display: flex; padding: 10px; background-color: var(--card-dark); border-top: 1px solid #333; }
        #chat-input { flex-grow: 1; background-color: #3e3e3e; border: none; color: var(--text-light); border-radius: 20px; padding: 10px 15px; }
        #chat-send-btn { background: none; border: none; color: var(--theme-pink); padding: 10px; cursor: pointer; }
        .match-user-action-btn { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 10px; font-size: 20px; line-height: 1; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1em;}
        .tag-checkbox-label { background: #3e3e3e; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 14px; display: inline-block; margin: 3px; }
        .tag-checkbox-label input { display: none; }
        .tag-checkbox-label.checked { background: var(--theme-pink); color: white;}
        #custom-interest-adder { display: flex; gap: 8px; }
        #custom-interest-input { flex-grow: 1; background: #3e3e3e; border-radius: 15px; padding: 8px 12px; border: 1px solid #555; color: white;}
        #add-interest-btn { background: #555; color: white; border: none; border-radius: 15px; padding: 8px 15px; cursor: pointer; }
        .profile-edit-section textarea { width: 100%; max-width: 300px; background: #3e3e3e; border-radius: 15px; padding: 12px; border: 1px solid #555; color: white; min-height: 80px; margin-top: 0.5em;}
        .game-container { text-align: center; padding: 10px; width: 100%;}
        #snake-canvas { background-color: #000; border: 2px solid var(--theme-pink); max-width: 100%; }
        .game-ui { display: flex; justify-content: space-around; align-items: center; padding: 10px 0; }
        .game-ui button, .play-game-button { background: var(--theme-pink); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 16px; cursor: pointer; }
        #game-score { font-size: 24px; font-weight: bold; }
        .ranking-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        .ranking-rank { font-size: 20px; font-weight: bold; color: var(--text-muted); width: 40px; text-align: center; }
        .ranking-avatar { width: 50px; height: 50px; border-radius: 50%; margin: 0 15px; object-fit: cover; }
        .ranking-info { flex-grow: 1; }
        .ranking-score { font-size: 22px; font-weight: bold; color: var(--theme-pink); }
        #pixel-canvas { border: 2px solid var(--theme-pink); cursor: crosshair; image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }
        #pixel-status { margin-top: 15px; color: var(--text-muted); min-height: 1.5em; }
        #color-palette { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 15px auto 0; max-width: 300px; }
        .color-choice { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 3px solid #555; transition: transform 0.2s; }
        .color-choice.selected { border-color: var(--text-light); transform: scale(1.1); }
        #shiritori-turn-info { padding: 10px; background-color: var(--card-dark); border-radius: 10px; margin-bottom: 15px; }
        #shiritori-history { width: 100%; max-width: 350px; height: 40vh; background-color: #000; border: 1px solid #444; border-radius: 10px; overflow-y: auto; padding: 10px; margin-bottom: 15px; display: flex; flex-direction: column; }
        .shiritori-word { padding: 5px 10px; border-radius: 15px; margin-bottom: 5px; max-width: 80%; }
        .shiritori-word.mine { background-color: var(--theme-pink); align-self: flex-end; text-align: right;}
        .shiritori-word.others { background-color: #3e3e3e; align-self: flex-start; }
        .shiritori-word small { font-size: 0.7em; color: var(--text-muted); display: block; }
        #shiritori-input-area { display: flex; width: 100%; max-width: 350px; gap: 10px; }
        #shiritori-input { flex-grow: 1; }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <!-- ▼▼▼ 修正箇所 ▼▼▼ ローディング表示を追加 -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <div id="login-form">
                    <h1>孤選</h1>
                    <p>学校のメールアドレスでログイン/登録</p>
                    <input type="email" id="email-input" placeholder="sXXXXX@s.akashi.ac.jp">
                    <button id="send-link-btn" onclick="sendSignInLink()">認証メールを送信</button>
                    <p id="login-message" style="font-size:0.9em;margin-top:1em;height:2.5em;color:var(--text-muted)"></p>
                </div>
                <div id="loading-indicator" style="display: none;">
                    <h1>孤選</h1>
                    <p>ログイン処理中です...</p>
                </div>
            </div>
        </div>
        <!-- ▲▲▲ 修正箇所ここまで ▲▲▲ -->

        <div id="profile-setup-screen" class="screen"><div class="login-container"><h1>ようこそ！</h1><p>はじめにプロフィールを設定してください</p><p style="font-size:0.9em;margin-top:1.5em">好きなアバターを選んでください</p><div id="avatar-selection-grid"></div><input type="text" id="register-name" placeholder="ニックネーム"><select id="register-faculty"><option value="機械工学科">M科</option><option value="電気情報工学科">E科</option><option value="都市システム工学科">C科</option><option value="建築学科">A科</option></select><select id="register-grade"><option value="1年">1年</option><option value="2年">2年</option><option value="3年">3年</option><option value="4年">4年</option><option value="5年">5年</option><option value="専攻科1年">専攻科1年</option><option value="専攻科2年">専攻科2年</option></select><button onclick="handleProfileSetup()" id="setup-button">登録して利用を開始する</button></div></div>
        <div id="main-screen" class="screen"><div class="app-container"><div id="card-stack"></div><div id="actions-area" class="actions"><div class="action-btn nope" onclick="handleNope()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></div><div class="action-btn like" onclick="handleLikeClick()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg></div></div></div><nav id="main-nav"></nav></div>
        <div id="matches-screen" class="screen"><div class="list-container"><h2>マッチング一覧</h2><div id="match-list"></div></div><nav id="matches-nav"></nav></div>
        <div id="profile-screen" class="screen"><div class="list-container"><div class="profile-edit-section"><h2>アバターの変更</h2><div id="avatar-edit-grid"></div><button onclick="updateAvatar()">アバターを更新</button></div><div class="profile-edit-section"><h2>興味・関心タグ</h2><div id="profile-interests-editor" class="tag-container"></div><div id="custom-interest-adder"><input type="text" id="custom-interest-input" placeholder="タグを自由に追加"><button id="add-interest-btn" onclick="addCustomInterest()">追加</button></div><button onclick="updateInterests()" style="margin-top:1em">興味タグを更新</button></div><div class="profile-edit-section"><h2>今日のひとこと</h2><p id="daily-topic-question-editor" style="color:var(--text-muted)"></p><textarea id="daily-topic-answer-input" placeholder="回答を入力..."></textarea><button onclick="updateDailyAnswer()">ひとことを更新</button></div><div class="profile-edit-section"><h2>アカウント設定</h2><button class="report-button" onclick="handleBugReport()">不具合を報告する</button><button class="logout-button" onclick="handleLogout()">ログアウト</button><button class="delete-button" onclick="handleDeleteAccount()">アカウントを完全に削除する</button></div></div><nav id="profile-nav"></nav></div>
        <div id="chat-screen" class="screen"><div class="chat-header"><button class="chat-back-btn" onclick="showTab('matches-screen')"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button><h2 id="chat-partner-name"></h2></div><div class="messages-container" id="messages-container"></div><div class="chat-input-area"><input type="text" id="chat-input" placeholder="メッセージを入力..."><button id="chat-send-btn" onclick="sendMessage()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/></svg></button></div></div>
        <div id="snake-game-screen" class="screen"><div class="app-container game-container"><h2>蛇ゲーム</h2><div id="game-score">Score: 0</div><canvas id="snake-canvas"></canvas><div class="game-ui"><button id="start-game-btn" onclick="startSnakeGame()">ゲーム開始</button></div><p style="color:var(--text-muted);font-size:0.8em;margin-top:15px">矢印キーまたは画面スワイプで操作してね</p></div><nav id="game-nav"></nav></div>
        <div id="pixel-game-screen" class="screen"><div class="app-container game-container"><h2>みんなのキャンバス</h2><p>1日1ピクセルだけ色を置いて、みんなで絵を完成させよう！</p><canvas id="pixel-canvas"></canvas><div id="color-palette"></div><div id="pixel-status"></div></div><nav id="pixel-nav"></nav></div>
        <div id="shiritori-game-screen" class="screen"><div class="app-container game-container"><h2>みんなでしりとり</h2><div id="shiritori-turn-info">読み込み中...</div><div id="shiritori-history"></div><div id="shiritori-input-area" class="login-container"><input type="text" id="shiritori-input" placeholder="ひらがなで入力"><button id="shiritori-submit-btn" onclick="handleShiritoriSubmit()">送信</button></div></div><nav id="shiritori-nav"></nav></div>
        <div id="ranking-screen" class="screen"><div class="list-container"><h2>ハイスコアランキング</h2><button class="play-game-button" onclick="showTab('snake-game-screen')" style="width:100%;margin-bottom:20px">蛇ゲームをプレイ</button><div id="ranking-list"></div></div><nav id="ranking-nav"></nav></div>
    </div>

        const getUserName=async id=>{if(usersCache[id])return usersCache[id];try{const d=await db.collection('users').doc(id).get();if(d.exists){const n=d.data().name;usersCache[id]=n;return n}}catch(e){console.error(e)}return"不明"};
        const initShiritoriGame=()=>{if(!currentUid)return;const ref=db.collection('shiritori').doc('currentGame');unsubShiri=ref.onSnapshot(async d=>{if(!d.exists){shiriInfo.textContent="しりとりが始まっていません";shiriIn.disabled=!1;shiriBtn.disabled=!1;return}await renderShiritori(d.data())})};
        const renderShiritori=async data=>{const{words,currentPlayerId}=data;shiriHist.innerHTML='';for(const e of words){const name=await getUserName(e.userId);const d=document.createElement('div');d.className=`shiritori-word ${e.userId===currentUid?'mine':'others'}`;d.innerHTML=`${sanitizeHTML(e.word)} <small>${sanitizeHTML(name)}</small>`;shiriHist.appendChild(d)}shiriHist.scrollTop=shiriHist.scrollHeight;const last=words[words.length-1];const next=getLastChar(last.word).nextChar;const curPlayerName=await getUserName(currentPlayerId);if(currentPlayerId===currentUid){shiriInfo.innerHTML=`あなたのターンです！<br>「${next}」から始まる言葉をどうぞ`;shiriIn.disabled=!1;shiriBtn.disabled=!1}else{shiriInfo.innerHTML=`現在 ${sanitizeHTML(curPlayerName)} さんのターン<br>次の文字：「${next}」`;shiriIn.disabled=!0;shiriBtn.disabled=!0}};
        const getLastChar=w=>{let last=w.slice(-1),next=last;if(last==='ー')next=w.slice(-2,-1);const s2l={'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ'};if(s2l[next])next=s2l[next];const vm={'じ':'ぢ','ず':'づ'},vmr={'ぢ':'じ','づ':'ず'};if(vm[next])return{next,alt:vm[next]};if(vmr[next])return{next,alt:vmr[next]};return{next,alt:null}};
        const handleShiritoriSubmit=async()=>{const w=shiriIn.value.trim();if(!w||!/^[ぁ-んー]+$/.test(w)||w.slice(-1)==='ん')return;shiriBtn.disabled=!0;const ref=db.collection('shiritori').doc('currentGame');try{await db.runTransaction(async t=>{const d=await t.get(ref);const newEntry={word:w,userId:currentUid,timestamp:firebase.firestore.FieldValue.serverTimestamp()};if(!d.exists){t.set(ref,{words:[newEntry],playerQueue:[currentUid],currentPlayerId:currentUid});return}const data=d.data();if(data.currentPlayerId!==currentUid)throw new Error("あなたのターンではありません");if(data.words.some(e=>e.word===w))throw new Error("その言葉は使用済みです");const last=data.words[data.words.length-1];const{next,alt}=getLastChar(last.word);if(w.charAt(0)!==next&&(!alt||w.charAt(0)!==alt))throw new Error(`「${next}」から始まる言葉を入力してください`);const newWords=[...data.words,newEntry];let q=data.playerQueue||[];if(!q.includes(currentUid))q.push(currentUid);const curIdx=q.indexOf(data.currentPlayerId);const nextIdx=(curIdx+1)%q.length;t.update(ref,{words:newWords,currentPlayerId:q[nextIdx],playerQueue:q})});shiriIn.value=''}catch(e){alert(e.message)}finally{const d=await ref.get();if(!d.exists()||(d.exists()&&d.data().currentPlayerId===currentUid))shiriBtn.disabled=!1}};
        
        const handleBugReport=async()=>{const r=prompt("不具合の内容を具体的に入力してください。");if(r&&r.trim()){try{await db.collection('bug_reports').add({reporterId:currentUid,report:r.trim(),timestamp:firebase.firestore.FieldValue.serverTimestamp(),userAgent:navigator.userAgent});alert('ご報告ありがとうございます')}catch(e){alert('報告の送信に失敗しました')}}};
        const renderRanking=async()=>{const list=$('ranking-list');list.innerHTML="<p>読込中...</p>";try{const snap=await db.collection('users').orderBy('pongHighScore','desc').limit(50).get();list.innerHTML="";if(snap.empty)return list.innerHTML="<p>まだ誰もプレイしていません</p>";let rank=1;snap.forEach(d=>{const u=d.data();if(!u.pongHighScore)return;list.innerHTML+=`<div class="ranking-item"><div class="ranking-rank">${rank}</div><img src="${u.photoURL||'/Deaikei/images/user (1).png'}" class="ranking-avatar"><div class="ranking-info"><h4>${sanitizeHTML(u.name)}</h4><p>${sanitizeHTML(u.faculty)}・${sanitizeHTML(u.grade)}</p></div><div class="ranking-score">${u.pongHighScore}</div></div>`;rank++})}catch(e){list.innerHTML="<p>ランキング取得失敗</p>"}};
        const renderMatches=async()=>{if(!currentUid)return;const list=$('match-list');list.innerHTML="マッチング情報読込中...";try{const myDoc=await db.collection('users').doc(currentUid).get();const myBlocked=(myDoc.data()||{}).blockedUsers||[];const myLikes=await db.collection('likes').where('from','==',currentUid).get();const likedByMe=myLikes.docs.map(d=>d.data().to);if(likedByMe.length===0)return list.innerHTML="まだマッチングした相手がいません";const matchedIds=[];for(let i=0;i<likedByMe.length;i+=10){const chunk=likedByMe.slice(i,i+10);const likedMeBack=await db.collection('likes').where('to','==',currentUid).where('from','in',chunk).get();likedMeBack.forEach(d=>matchedIds.push(d.data().from))}if(matchedIds.length===0)return list.innerHTML="まだマッチングした相手がいません";const userDocs=await Promise.all(matchedIds.map(id=>db.collection('users').doc(id).get()));list.innerHTML="";userDocs.forEach(d=>{if(!d.exists)return;const u=d.data();if(u.isBanned||myBlocked.includes(u.uid)||(u.blockedUsers&&u.blockedUsers.includes(currentUid)))return;list.innerHTML+=`<div class="match-item" onclick="openChat('${u.uid}','${u.name}','${u.photoURL}','${u.studentId||''}')"><img src="${u.photoURL||'/Deaikei/images/user (1).png'}" class="match-avatar"><div class="match-info"><h4>${sanitizeHTML(u.name)} <small>(${sanitizeHTML(u.studentId||'')})</small></h4><p>${sanitizeHTML(u.faculty)}・${sanitizeHTML(u.grade)}</p></div><button class="match-user-action-btn" onclick="handleUserAction(event,'${u.uid}','${u.name}')">•••</button></div>`});if(list.innerHTML==="")list.innerHTML="表示できるマッチ相手がいません"}catch(e){list.innerHTML="情報取得に失敗"}};
        const handleUserAction=(e,id,name)=>{e?.stopPropagation();const a=prompt(`'${name}'さんへの操作:\n1:ブロック\n2:通報`);if(a==='1')blockUser(id,name);else if(a==='2')reportUser(id,name)};
        const blockUser=async(id,name)=>{if(!confirm(`'${name}'さんをブロックしますか？`))return;try{await db.collection('users').doc(currentUid).update({blockedUsers:firebase.firestore.FieldValue.arrayUnion(id)});alert(`'${name}'さんをブロックしました`);if(document.querySelector(`.profile-card[data-user-id="${id}"]`))handleNope();if($('matches-screen').classList.contains('active'))renderMatches()}catch(e){alert("ブロック失敗")}};
        const reportUser=async(id,name)=>{const reason=prompt(`'${name}'さんを通報する理由を入力してください。`);if(reason&&reason.trim()){await db.collection('reports').add({reportedUserId:id,reporterId:currentUid,reason,timestamp:firebase.firestore.FieldValue.serverTimestamp()});alert('通報が送信されました');if(document.querySelector(`.profile-card[data-user-id="${id}"]`))handleNope()}};
        const renderProfileEditor=async()=>{if(!currentUid)return;const editor=$('profile-interests-editor');const dailyQEl=$('daily-topic-question-editor');const dailyAIn=$('daily-topic-answer-input');editor.innerHTML="<p>読込中...</p>";const d=await db.collection('users').doc(currentUid).get();if(!d.exists)return;const data=d.data();userInterestsCache=data.interests||[];renderInterestTags(editor,userInterestsCache);renderAvatarSelectionGrid('avatar-edit-grid',data.photoURL);const topic=getDailyTopic();dailyQEl.textContent=topic;dailyAIn.value=data.dailyTopicQuestion===topic?data.dailyAnswer||'':''};
        const updateDailyAnswer=async()=>{if(!currentUid)return;const answer=$('daily-topic-answer-input').value.trim();try{await db.collection('users').doc(currentUid).update({dailyTopicQuestion:getDailyTopic(),dailyAnswer:answer});alert('ひとことを更新しました')}catch(e){alert("更新失敗")}};
        const openChat=(targetId,targetName,targetPhoto,targetSid)=>{if(!currentUid||!targetId)return;currentChatRoomId=[currentUid,targetId].sort().join('_');$('chat-partner-name').textContent=`${sanitizeHTML(targetName)} (${sanitizeHTML(targetSid||'')})`;showTab('chat-screen');const messagesContainer=$('messages-container');messagesContainer.innerHTML='';const q=db.collection('chats').doc(currentChatRoomId).collection('messages').orderBy('timestamp','asc');unsubscribeChat=q.onSnapshot(snap=>{messagesContainer.innerHTML='';snap.forEach(d=>{const msg=d.data();const b=document.createElement('div');b.className=`message-bubble ${msg.senderId===currentUid?'sent':'received'}`;b.textContent=msg.text;messagesContainer.appendChild(b)});messagesContainer.scrollTop=messagesContainer.scrollHeight})};
        const sendMessage=async()=>{const input=$('chat-input');const text=input.value.trim();if(text===''||!currentChatRoomId||!currentUid)return;const tempText=text;input.value='';try{await db.collection('chats').doc(currentChatRoomId).collection('messages').add({text:tempText,senderId:currentUid,timestamp:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert("メッセージ送信失敗");input.value=tempText}};
        const handleLogout=()=>{if(confirm("ログアウトしますか？"))auth.signOut()};
        const handleDeleteAccount=async()=>{const u=auth.currentUser;if(!u||!confirm("本当にアカウントを削除しますか？\nこの操作は取り消せません。"))return;try{await db.collection('users').doc(u.uid).delete();await u.delete();alert('アカウントが削除されました')}catch(e){alert('アカウント削除に失敗。再ログインが必要です')}};
        const renderAvatarSelectionGrid=(gridId,currentUrl=null)=>{const grid=$(gridId);grid.innerHTML='';avatarUrls.forEach(url=>{const img=document.createElement('img');img.src=url;img.className='avatar-option';img.dataset.url=url;if(url===currentUrl)img.classList.add('selected');img.onclick=()=>{document.querySelectorAll(`#${gridId} .avatar-option`).forEach(el=>el.classList.remove('selected'));img.classList.add('selected')};grid.appendChild(img)})};
        const renderInterestTags=(container,userTags)=>{const tags=[...new Set([...allInterests,...userTags])].sort();container.innerHTML='';tags.forEach(interest=>{const label=document.createElement('label');label.className='tag-checkbox-label';const chk=document.createElement('input');chk.type='checkbox';chk.value=interest;if(userTags.includes(interest)){chk.checked=!0;label.classList.add('checked')}chk.onchange=()=>{label.classList.toggle('checked',chk.checked);if(chk.checked){if(!userInterestsCache.includes(chk.value))userInterestsCache.push(chk.value)}else{userInterestsCache=userInterestsCache.filter(t=>t!==chk.value)}};label.appendChild(chk);label.appendChild(document.createTextNode(sanitizeHTML(interest)));container.appendChild(label)})};
        const addCustomInterest=()=>{const input=$('custom-interest-input');const newI=input.value.trim();if(newI&&!userInterestsCache.includes(newI)){userInterestsCache.push(newI);renderInterestTags($('profile-interests-editor'),userInterestsCache)}input.value=''};
        const updateInterests=async()=>{if(!currentUid)return;try{await db.collection('users').doc(currentUid).update({interests:userInterestsCache});alert('興味タグを更新しました')}catch(e){alert("更新失敗")}};
        const updateAvatar=async()=>{if(!currentUid)return;const selected=$('#avatar-edit-grid .avatar-option.selected');if(!selected)return alert('新しいアバターを選択してください');try{await db.collection('users').doc(currentUid).update({photoURL:selected.dataset.url});alert('アバターを更新しました')}catch(e){alert("更新失敗")}};
        const sendSignInLink=async()=>{const emailInput=$('email-input'),sendBtn=$('send-link-btn'),msgEl=$('login-message');const email=emailInput.value.trim();if(!email.endsWith('@s.akashi.ac.jp')){msgEl.textContent='@s.akashi.ac.jp のみ登録可能です';return}const settings={url:window.location.href,handleCodeInApp:!0};sendBtn.disabled=!0;msgEl.textContent='送信中...';try{await auth.sendSignInLinkToEmail(email,settings);window.localStorage.setItem('emailForSignIn',email);msgEl.textContent=`認証リンクを ${email} に送信しました。`;alert(`認証リンクを送信しました。\nメールを開き、このブラウザでログインを完了してください。`)}catch(e){msgEl.textContent='メール送信に失敗: '+e.message}finally{sendBtn.disabled=!1}};
        
        // ▼▼▼ 修正箇所 ▼▼▼ 認証完了後のURLクリーンアップを追加
        const handleEmailLinkSignIn=async()=>{
            const msgEl = $('login-message');
            let email = window.localStorage.getItem('emailForSignIn');
            if (!email) {
                email = window.prompt('認証を完了するため、メールアドレスを再入力してください');
                if (!email) {
                    msgEl.textContent = '認証がキャンセルされました。';
                    $('loading-indicator').style.display = 'none';
                    $('login-form').style.display = 'block';
                    return;
                }
            }
            try {
                await auth.signInWithEmailLink(email, window.location.href);
                window.localStorage.removeItem('emailForSignIn');
                // 認証成功後、URLから認証情報を削除してリロードを防ぐ
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (error) {
                msgEl.textContent = 'ログインに失敗しました: ' + error.message;
                alert('ログインに失敗しました。');
                window.history.replaceState({}, document.title, window.location.pathname);
                $('loading-indicator').style.display = 'none';
                $('login-form').style.display = 'block';
            }
        };
        // ▲▲▲ 修正箇所ここまで ▲▲▲
    </script>
</body>
</html>
